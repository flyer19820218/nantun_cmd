name: 🏔️ 南屯指揮部自動化觀測

on:
  schedule:
    - cron: '*/5 1-4 * * 1-5' # 台灣 09:00 - 12:55
    - cron: '0,5,10,15,20,25,30 5 * * 1-5' # 台灣 13:00 - 13:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install yfinance
      - name: Run calculation
        run: python update_assets.py
      - name: Deploy
        run: |
          git config --global user.name "CommandBot"
          git config --global user.email "bot@github.com"
          git add index.html
          git commit -m "🚀 重啟純化實驗: $(date)" || exit 0
          git push
