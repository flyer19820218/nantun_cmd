name: 🏔️ 南屯指揮部自動化觀測

on:
  schedule:
    # 第一段：台灣時間 09:00 到 12:50 (UTC 01:00 ~ 04:50)，每 10 分鐘一次
    - cron: '*/10 1-4 * * 1-5'
    # 第二段：台灣時間 13:00 到 13:30 (UTC 05:00, 10, 20, 30 分精準發射)
    - cron: '0,10,20,30 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install yfinance
      - name: Run calculation
        run: python update_assets.py
      - name: Deploy
        run: |
          git config --global user.name "CommandBot"
          git config --global user.email "bot@github.com"
          git add index.html
          git commit -m "🚀 戰情室同步更新: $(date)" || exit 0
          git push
